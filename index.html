<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Simulador CloudPages</title>
<script>
  (function(){
    try {
      var saved = localStorage.getItem("csb-theme");
      var theme = saved === "light" || saved === "dark"
        ? saved
        : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Layout: duas colunas (input | output com abas) no desktop; empilha no mobile.
     Paineis de log usam pills de severidade para leitura rapida (padrao dashboard). */
  :root{
    --bg:#f3f5fa;
    --surface:#ffffff;
    --surface-2:#f8fafc;
    --border:#e4e8f0;
    --fg:#0f172a;
    --fg-muted:#64748b;
    --accent:#5b5bd6;
    --accent-fg:#ffffff;
    --accent-soft:rgba(91,91,214,0.12);
    --panel-shadow:0 1px 2px rgba(15,23,42,0.05),0 10px 28px rgba(15,23,42,0.06);
    --tab-active-line:#5b5bd6;
    --critical:#dc2626;
    --critical-bg:#fef2f2;
    --warning:#d97706;
    --warning-bg:#fffbeb;
    --ok:#059669;
    --ok-bg:#ecfdf5;
    --info:#2563eb;
    --info-bg:#eff6ff;
    --code-bg:#111827;
    --code-fg:#e5e7eb;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14161a;
      --surface:#1c1f24;
      --surface-2:#22262c;
      --border:#30353c;
      --accent-soft:rgba(123,147,255,0.14);
      --panel-shadow:none;
      --tab-active-line:#7b93ff;
      --fg:#e9ebe6;
      --fg-muted:#9aa09a;
      --accent:#7b93ff;
      --accent-fg:#0d1021;
      --critical:#ff8585;
      --critical-bg:#3a1e1f;
      --warning:#f0b84f;
      --warning-bg:#3a2e14;
      --ok:#6fd19c;
      --ok-bg:#163424;
      --info:#7fb8ec;
      --info-bg:#182c3a;
      --code-bg:#0c0e10;
      --code-fg:#cfd4cf;
      color-scheme:dark;
    }
  }
  :root[data-theme="light"]{
    --bg:#f3f5fa;
    --surface:#ffffff;
    --surface-2:#f8fafc;
    --border:#e4e8f0;
    --fg:#0f172a;
    --fg-muted:#64748b;
    --accent:#5b5bd6;
    --accent-fg:#ffffff;
    --accent-soft:rgba(91,91,214,0.12);
    --panel-shadow:0 1px 2px rgba(15,23,42,0.05),0 10px 28px rgba(15,23,42,0.06);
    --tab-active-line:#5b5bd6;
    --critical:#dc2626;
    --critical-bg:#fef2f2;
    --warning:#d97706;
    --warning-bg:#fffbeb;
    --ok:#059669;
    --ok-bg:#ecfdf5;
    --info:#2563eb;
    --info-bg:#eff6ff;
    --code-bg:#111827;
    --code-fg:#e5e7eb;
    color-scheme:light;
  }
  :root[data-theme="dark"]{
    --bg:#14161a;
    --surface:#1c1f24;
    --surface-2:#22262c;
    --border:#30353c;
    --accent-soft:rgba(123,147,255,0.14);
    --panel-shadow:none;
    --tab-active-line:#7b93ff;
    --fg:#e9ebe6;
    --fg-muted:#9aa09a;
    --accent:#7b93ff;
    --accent-fg:#0d1021;
    --critical:#ff8585;
    --critical-bg:#3a1e1f;
    --warning:#f0b84f;
    --warning-bg:#3a2e14;
    --ok:#6fd19c;
    --ok-bg:#163424;
    --info:#7fb8ec;
    --info-bg:#182c3a;
    --code-bg:#0c0e10;
    --code-fg:#cfd4cf;
    color-scheme:dark;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--fg);
    font-family:'Manrope',system-ui,sans-serif;
    display:flex;
    flex-direction:column;
  }
  .app{
    flex:1;
    display:flex;
    flex-direction:column;
    min-height:100%;
  }

  .topbar{
    border-bottom:1px solid var(--border);
    background:var(--surface);
    box-shadow:0 1px 0 rgba(15,23,42,0.04);
  }
  .topbar-inner{
    padding-block:18px;
    padding-left:max(20px, env(safe-area-inset-left, 0px));
    padding-right:max(20px, env(safe-area-inset-right, 0px));
    display:flex;
    align-items:center;
    gap:14px;
    margin:0 auto;
  }
  .brand-mark{
    width:38px;height:38px;flex:none;
    border-radius:11px;
    background:linear-gradient(140deg,#6366f1 0%,#5b5bd6 52%,#8b5cf6 100%);
    color:var(--accent-fg);
    box-shadow:0 4px 14px rgba(91,91,214,0.28);
    display:flex;align-items:center;justify-content:center;
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    font-size:15px;
  }
  .topbar h1{
    margin:0;
    font-size:17px;
    font-weight:800;
    letter-spacing:-0.01em;
  }
  .topbar p{
    margin:2px 0 0;
    font-size:13px;
    color:var(--fg-muted);
  }
  .theme-switch{
    position:relative;
    margin-left:auto;
    flex:none;
    display:inline-flex;
    border:1px solid var(--border);
    border-radius:999px;
    padding:2px;
    background:var(--surface);
  }
  .theme-switch-glide{
    position:absolute;
    top:2px;
    bottom:2px;
    left:2px;
    width:calc(50% - 2px);
    border-radius:999px;
    background:var(--accent);
    transition:transform .22s ease;
    pointer-events:none;
    z-index:0;
  }
  .theme-switch.is-dark .theme-switch-glide{
    transform:translateX(calc(100%));
  }
  .theme-btn{
    position:relative;
    z-index:1;
    width:36px;
    height:36px;
    border:none;
    background:transparent;
    color:var(--fg-muted);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    padding:0;
    border-radius:999px;
    transition:color .18s ease;
  }
  .theme-btn svg{
    width:16px;
    height:16px;
    display:block;
  }
  .theme-btn[aria-pressed="true"]{
    color:var(--accent-fg);
  }
  .theme-btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  .layout{
    position:relative;
    flex:1;
    display:flex;
    gap:14px;
    padding:14px max(16px, env(safe-area-inset-left,0px)) max(16px, env(safe-area-inset-bottom,0px));
    background:var(--bg);
    width:100%;
    margin:0 auto;
  }
  @media (max-width: 860px){
    .layout{flex-direction:column;}
    .layout .pane-input{flex-basis:auto!important;width:auto!important;opacity:1!important;}
  }

  .pane{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    box-shadow:var(--panel-shadow);
    display:flex;
    flex-direction:column;
    min-width:0;
    min-height:0;
    overflow:hidden;
  }
  .pane-input{
    flex:0 0 420px;
    width:420px;
    min-height:420px;
    overflow:hidden;
    transition:flex-basis .22s ease, width .22s ease, opacity .18s ease;
  }
  .layout.input-collapsed .pane-input{
    flex:0 0 0;
    width:0;
    opacity:0;
    pointer-events:none;
  }
  .pane-output{flex:1 1 auto; min-height:560px;}

  .expand-rail{
    display:none;
    top:14px;
    left:max(10px, env(safe-area-inset-left,0px));
    z-index:5;
    width:30px;
    height:30px;
    border:1px solid var(--border);
    border-radius:8px;
    background:var(--surface);
    color:var(--fg-muted);
    font-size:14px;
    cursor:pointer;
    align-items:center;
    justify-content:center;
  }
  .layout.input-collapsed .expand-rail{display:flex;}
  .expand-rail:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  .pane-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    padding:14px max(16px, env(safe-area-inset-left,0px)) 10px max(16px, env(safe-area-inset-left,0px));
  }
  .pane-actions{
    display:flex;
    flex-wrap:wrap;
    justify-content:flex-end;
    gap:8px;
  }
  .pane-head h2{
    margin:0;
    font-size:13px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--fg-muted);
  }

  textarea#codeInput{
    flex:1;
    margin:0 max(16px, env(safe-area-inset-left,0px)) max(16px, env(safe-area-inset-bottom,0px));
    padding:14px;
    resize:none;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--code-bg);
    color:var(--code-fg);
    font-family:'JetBrains Mono',monospace;
    font-size:12.5px;
    line-height:1.55;
    min-height:260px;
  }
  textarea#codeInput:focus,
  textarea#codeInput.is-dragover{
    outline:2px solid var(--accent);
    outline-offset:1px;
  }
  .file-input{
    position:absolute;
    width:1px;
    height:1px;
    padding:0;
    margin:-1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    border:0;
  }

  .pane-foot{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .hint{font-size:12px;color:var(--fg-muted);}

  .btn{
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--fg);
    font-family:inherit;
    font-weight:600;
    font-size:13px;
    padding:6px 14px;
    border-radius:8px;
    cursor:pointer;
  }
  .btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  
  .btn-primary{
    background:var(--accent);
    color:var(--accent-fg);
    border-color:var(--accent);
    box-shadow:0 1px 2px rgba(91,91,214,0.18),0 6px 16px rgba(91,91,214,0.16);
  }

  .tabs{
    display:flex;
    gap:6px;
    padding:12px max(16px, env(safe-area-inset-left,0px)) 0 max(16px, env(safe-area-inset-left,0px));
    border-bottom:1px solid var(--border);
    background:linear-gradient(180deg,var(--surface-2) 0%,var(--surface) 100%);
  }
  .tab{
    border:none;
    color:var(--fg-muted);
    font-family:inherit;
    font-weight:700;
    font-size:13px;
    padding:8px 14px;
    border-radius:10px 10px 0 0;
    cursor:pointer;
    display:flex;align-items:center;gap:6px;
    background:transparent;
    border-bottom:2px solid transparent;
    margin-bottom:-1px;
  }
  .tab.active{
    color:var(--accent);
    background:var(--accent-soft);
    border-bottom-color:var(--tab-active-line);
  }
  .tab:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .badge{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    font-weight:600;
    background:var(--critical);
    color:#fff;
    border-radius:999px;
    padding:1px 7px;
  }

  .tab-panel{
    flex:1;
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  #panel-preview{
    background:#000;
  }
  #panel-preview .preview-label,
  #panel-preview .hint{
    color:#b8beb6;
  }

  .preview-toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:10px max(16px, env(safe-area-inset-left,0px));
  }
  .preview-label{font-size:12px;color:var(--fg-muted);}
  .viewport-switch{
    position:relative;
    display:inline-flex;
    border:1px solid var(--border);
    border-radius:999px;
    padding:2px;
    background:var(--surface);
    flex:none;
  }
  .viewport-switch-glide{
    position:absolute;
    top:2px;
    bottom:2px;
    left:2px;
    width:calc(50% - 2px);
    border-radius:999px;
    background:var(--accent);
    transition:transform .22s ease;
    pointer-events:none;
    z-index:0;
  }
  .viewport-switch.is-mobile .viewport-switch-glide{
    transform:translateX(calc(100%));
  }
  .vbtn{
    position:relative;
    z-index:1;
    border:none;
    background:transparent;
    color:var(--fg-muted);
    font-family:inherit;
    font-size:12px;
    font-weight:600;
    padding:7px 14px;
    min-width:76px;
    cursor:pointer;
    border-radius:999px;
    transition:color .18s ease;
  }
  .vbtn.active{color:var(--accent-fg);}
  .vbtn:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  .iframe-wrap{
    flex:1;
    display:flex;
    align-items: center;
    justify-content:center;
    padding:0 max(16px, env(safe-area-inset-left,0px)) max(16px, env(safe-area-inset-bottom,0px));
    min-height:0;
    overflow-x:auto;
    background:#000;
  }
  #previewFrame{
    width:100%;
    max-width:1440px;
    min-width:0;
    height:100%;
    min-height:420px;
    border:1px solid var(--border);
    border-radius:10px;
    background:#fff;
    color-scheme:light;
    display:block;
  }
  #previewFrame.mobile{width:100%; max-width:390px; min-width:0;}
  .preview-scale-hint{font-size:11px; color:var(--fg-muted);}

  #panel-log{
    padding:0 max(16px, env(safe-area-inset-left,0px)) max(16px, env(safe-area-inset-bottom,0px));
    overflow:auto;
  }
  .log-summary{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    padding:14px 0 6px;
  }
  .pill{
    display:flex;
    align-items:center;
    gap:6px;
    padding:6px 10px;
    border-radius:999px;
    font-size:12px;
    font-weight:700;
    font-family:'JetBrains Mono',monospace;
  }
  .pill-critical{background:var(--critical-bg);color:var(--critical);}
  .pill-warning{background:var(--warning-bg);color:var(--warning);}
  .pill-ok{background:var(--ok-bg);color:var(--ok);}
  .pill-info{background:var(--info-bg);color:var(--info);}

  .log-list{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px;}
  .log-item{
    border:1px solid var(--border);
    border-left:4px solid var(--border);
    border-radius:10px;
    padding:10px 12px;
    background:var(--surface);
    display:flex;
    gap:10px;
    box-shadow:0 1px 2px rgba(15,23,42,0.03);
  }
  .log-item.level-critical{border-left-color:var(--critical);}
  .log-item.level-warning{border-left-color:var(--warning);}
  .log-item.level-ok{border-left-color:var(--ok);}
  .log-item.level-info{border-left-color:var(--info);}
  .log-dot{
    flex:none;
    width:8px;height:8px;border-radius:999px;margin-top:6px;
  }
  .level-critical .log-dot{background:var(--critical);}
  .level-warning .log-dot{background:var(--warning);}
  .level-ok .log-dot{background:var(--ok);}
  .level-info .log-dot{background:var(--info);}
  .log-item h3{
    margin:0 0 3px;
    font-size:13px;
    font-weight:700;
  }
  .log-item p{
    margin:0;
    font-size:12.5px;
    color:var(--fg-muted);
    line-height:1.45;
  }
  .log-item code{
    font-family:'JetBrains Mono',monospace;
    background:var(--code-bg);
    color:var(--code-fg);
    padding:1px 5px;
    border-radius:4px;
    font-size:11.5px;
  }

  [hidden]{display:none!important;}

  :root[data-theme="dark"] .topbar{
    box-shadow:none;
  }
  :root[data-theme="dark"] .brand-mark{
    background:var(--accent);
    box-shadow:none;
  }
  :root[data-theme="dark"] .btn-primary{
    box-shadow:none;
  }
  :root[data-theme="dark"] .tab.active{
    color:var(--fg);
    background:var(--surface-2);
  }
  :root[data-theme="dark"] .tabs{
    background:var(--surface);
  }

  .boot-error{
    margin:12px max(16px, env(safe-area-inset-left,0px));
    padding:12px 14px;
    border-radius:8px;
    border:1px solid var(--critical);
    background:var(--critical-bg);
    color:var(--critical);
    font-size:13px;
    line-height:1.45;
  }
</style>
</head>
<body>

<div id="bootError" class="boot-error" hidden></div>

<div class="app">
  <header class="topbar">
    <div class="topbar-inner">
      <span class="brand-mark">CSB</span>
      <div>
        <h1>CloudSandbox</h1>
        <p>Veja como a sua LP fica depois do deploy no CloudPages (Salesforce Marketing Cloud)!</p>
      </div>
      <div class="theme-switch" id="themeSwitch" role="group" aria-label="Tema da interface">
        <span class="theme-switch-glide" aria-hidden="true"></span>
        <button id="themeLightBtn" class="theme-btn" type="button" data-theme-value="light" title="Tema claro" aria-label="Tema claro" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
          </svg>
        </button>
        <button id="themeDarkBtn" class="theme-btn" type="button" data-theme-value="dark" title="Tema escuro" aria-label="Tema escuro" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="layout" id="layoutRoot">
    <button id="expandInputBtn" class="expand-rail" type="button" aria-label="Mostrar box de código" title="Mostrar box de código">&rsaquo;</button>
    <section class="pane pane-input">
      <div class="pane-head">
        <h2>Código da LP</h2>
        <div class="pane-actions">
          <button id="uploadBtn" class="btn btn-ghost" type="button">Upload HTML</button>
          <input id="fileInput" class="file-input" type="file" accept=".html,.htm,.txt,text/html,text/plain" tabindex="-1" aria-hidden="true">
          <div class="pane-foot">
            <button id="analyzeBtn" class="btn btn-primary">Analisar</button>
          </div>
          <button id="collapseInputBtn" class="btn btn-ghost" type="button" aria-label="Ocultar box de código" title="Ocultar box de código">&lsaquo;</button>
        </div>
      </div>
      <textarea id="codeInput" spellcheck="false" placeholder="Cole o HTML da LP, ou arraste um arquivo .html para cá..."></textarea>
      
    </section>

    <section class="pane pane-output">
      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="preview" role="tab" aria-selected="true">Preview simulado</button>
        <button class="tab" data-tab="log" role="tab" aria-selected="false">Log de validação <span id="logBadge" class="badge" hidden>0</span></button>
      </div>

      <div class="tab-panel" id="panel-preview">
        <div class="preview-toolbar">
          <span id="charCount" class="hint"></span>
          <span class="preview-label">Resultado estimado após o deploy no CloudPages</span>
          <div class="viewport-switch" id="viewportSwitch" role="group" aria-label="Largura do preview">
            <span class="viewport-switch-glide" aria-hidden="true"></span>
            <button class="vbtn active" type="button" data-width="desktop">Desktop</button>
            <button class="vbtn" type="button" data-width="mobile">Mobile</button>
          </div>
        </div>
        <div class="iframe-wrap">
          <iframe id="previewFrame" sandbox="allow-scripts allow-forms" title="Preview simulado pós-deploy"></iframe>
        </div>
      </div>

      <div class="tab-panel" id="panel-log" hidden>
        <div class="log-summary" id="logSummary"></div>
        <ul class="log-list" id="logList"></ul>
      </div>
    </section>
  </main>
</div>

<script src="./script/simulador-cloudpages.js" defer onerror="(function(){var el=document.getElementById('bootError');if(el){el.hidden=false;el.textContent='Não foi possível carregar script/simulador-cloudpages.js. Abra a pasta CloudSandbox e use index.html (não mova só este arquivo).';}})();"></script>
</body>
</html>
